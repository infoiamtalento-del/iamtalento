<!DOCTYPE html>
<!--
=====================================================================
 I AM TALENTO PRO | Job portal (Naukri / LinkedIn style) - single file
=====================================================================
 HOW TO RUN : double-click this file (index.html). No install, no server.
       Needs internet only for Google Fonts (has fallbacks).
 STACK   : plain HTML + CSS + vanilla JavaScript (no framework, no build).
 STORAGE  : browser localStorage, keys prefixed "tq_" (users, jobs, apps, sess).
       Passwords are plain text -> DEMO ONLY. Replace with real auth/backend.
 ROLES   : candidate (employee) and employer. Demo logins on the sign-in page.
 SECTIONS IN THE SCRIPT BLOCK (top to bottom):
  1. Data: SEED jobs, CANDS (sample talent), BR/CI (brand fonts, industry/size)
  2. LG = real brand logo SVG paths (Simple Icons, CC0). Add more here.
  3. Helpers: score() match %, tscore() talent score, autoUpd() 24h rule
  4. Views: authV, candV (dash/jobs/upd/saved/applied/profile), empV (dash/pipe/post/talent/cp)
  5. Drawers: rd() job drawer, applicant drawer, candidate drawer
  6. Event handling: ONE delegated click handler using data-a="action" attributes
  7. Smart features: parseQ() smart search, fit()/fitC() fit breakdowns, disc() swipe mode,
   compare tables, recC() recommendations, confetti()
  8. AI Assistant: aiC()/aiE() local analyzer, aiLLM() optional real Claude AI, rai() chat panel
  9. Simulations: setInterval blocks that fake live events (replace with realtime backend)
 SEE ALSO  : REQUIREMENTS.md (full spec, data model, backend mapping).
=====================================================================
-->

     if (o.ex != null) F.e = o.ex;
     if (!o.sk.length && !o.loc) F.q = v;
     render();
     toast(
      " " +
       (actv()
        .map((x) => x[1])
        .join(" · ") || "Showing all jobs"),
     );
    } else if (a === "tsmart") {
     const v = $("tsm").value,
      o = parseQ(v),
      L = o.lv.length ? o.lv : o.ex != null ? [lvl(o.ex)] : [];
     $("tk").value = o.sk.join(", ");
     $("tc").value = o.loc;
     document.querySelectorAll('[data-t="lv"]').forEach((x) => (x.checked = L.includes(x.value)));
     $("twp").value = o.m[0] || "";
     $("tcr").checked = /certif/i.test(v);
     if (o.sal) {
      $("tes").value = Math.min(60, o.sal);
      $("tsv2").textContent = Math.min(60, o.sal);
     }
     $("tn").value = /immediate|asap/i.test(v) ? "0" : "999";
     tl();
     toast(" Smart filters applied");
    } else if (a === "tp") {
     ({
      imm: () => ($("tn").value = "0"),
      cert: () => ($("tcr").checked = true),
      top: () => {
       $("tas").value = 85;
       $("tav").textContent = "85";
      },
      sen: () => (document.querySelector('[data-t="lv"][value="Senior"]').checked = true),
      rem: () => ($("twp").value = "Remote"),
     })[t.dataset.s]();
     tl();
    } else if (a === "cj") {
     const i = CMPJ.indexOf(id);
     if (i > -1) CMPJ.splice(i, 1);
     else if (CMPJ.length < 3) CMPJ.push(id);
     else toast("Compare up to 3 jobs");
     rl();
    } else if (a === "cc") {
     const n = t.dataset.n,
      i = CMPC.indexOf(n);
     if (i > -1) CMPC.splice(i, 1);
     else if (CMPC.length < 3) CMPC.push(n);
     else toast("Compare up to 3 candidates");
     tl();
    } else if (a === "cgo") {
     op = { t: t.dataset.k === "j" ? "cmpj" : "cmpc" };
     rd();
    } else if (a === "dx") {
     const d = t.dataset.d,
      c = $("dc");
     if (c) c.classList.add(d === "skip" ? "fl" : d === "save" ? "fu" : "fr");
     setTimeout(() => {
      if (d === "skip") (u.skip = u.skip || []).push(id);
      else if (d === "save") {
       u.saved = u.saved || [];
       if (!u.saved.includes(id)) u.saved.push(id);
       toast("Saved ");
      } else {
       doApply(id, u);
       toast("Applied Update due within 24 hours");
       confetti();
      }
      save();
      render();
     }, 290);
    } else if (a === "rskip") {
     u.skip = [];
     save();
     render();
    } else if (a === "invall") {
     u.inv = u.inv || [];
     const j = jobs.find((x) => x.id === id),
      ap = apps.filter((x) => x.jid === id).map((x) => x.name);
     CANDS.filter((c) => !ap.includes(c.n))
      .map((c) => ({ c, s: tscore(c, j) }))
      .sort((x, y) => y.s - x.s)
      .slice(0, 3)
      .forEach(({ c }) => {
       if (!u.inv.includes(c.n)) u.inv.push(c.n);
      });
     save();
     toast(" Invited the top candidates");
     confetti();
     render();
    } else if (a === "pt") {
     PT = t.dataset.s;
     PV = false;
     render();
    } else if (a === "pvw") {
     PV = !PV;
     render();
    } else if (a === "psave2") {
     Object.assign(u, {
      name: $("pn").value,
      head: $("ph").value,
      city: $("pc").value,
      exp: +$("px").value,
      about: $("pa").value,
      links: { li: $("pli").value, gh: $("pgh").value },
     });
     save();
     toast("Profile saved ");
     render();
    } else if (a === "pfsave") {
     u.pf = {
      sal: +$("pf_sal").value,
      np: +$("pf_np").value,
      wm: $("pf_wm").value,
      ty: $("pf_ty").value,
      loc: $("pf_lc").value,
      rl: $("pf_rl").checked,
     };
     save();
     toast("Preferences saved ");
     render();
    } else if (a === "padd") {
     const k = t.dataset.k,
      FD = { ex: ["co", "role", "fr", "to", "d"], ed: ["sc", "dg", "yr"], pj: ["t", "l", "d"], ce: ["n", "is"], sk: ["n", "lv"] },
      o = {};
     FD[k].forEach((x) => (o[x] = $(k + "_" + x).value.trim()));
     if (!o[FD[k][0]]) {
      toast("Fill the first field");
      return;
     }
     if (k === "ce") (u.ce = u.ce || []).push(o.n + (o.is ? " · " + o.is : ""));
     else if (k === "sk") {
      (u.sk = u.sk || []).push(o.n);
      (u.sl = u.sl || {})[o.n] = o.lv;
     } else (u[k] = u[k] || []).push(o);
     save();
     toast("Added ");
     render();
    } else if (a === "prm") {
     (u[t.dataset.k] || []).splice(+t.dataset.i, 1);
     save();
     render();
    } else if (a === "qs") {
     QZ = { sk: t.dataset.s, i: 0, sc: 0 };
     render();
    } else if (a === "qa") {
     const n = SKQ[QZ.sk].length;
     if (+t.dataset.o === SKQ[QZ.sk][QZ.i][2]) QZ.sc++;
     QZ.i++;
     if (QZ.i >= n) {
      (u.as = u.as || {})[QZ.sk] = Math.round((QZ.sc / n) * 100);
      toast("Assessment done: " + u.as[QZ.sk] + "% ");
      QZ = null;
      save();
     }
     render();
    } else if (a === "ben") {
     u.cp = u.cp || {};
     const b = (u.cp.ben = u.cp.ben || []),
      i = b.indexOf(t.dataset.s);
     i > -1 ? b.splice(i, 1) : b.push(t.dataset.s);
     save();
     render();
    } else if (a === "cpsave") {
     u.cp = Object.assign(u.cp || {}, {
      about: $("cpa").value,
      mission: $("cpm").value,
      ind: $("cpi").value,
      size: $("cps").value,
      hq: $("cph").value,
      site: $("cpw").value,
     });
     save();
     toast("Company profile saved ");
     render();
    } else if (a === "eye") {
     const p = $("pw");
     p.type = p.type === "password" ? "text" : "password";
    } else if (a === "addsk") {
     u.sk = [...(u.sk || []), t.dataset.s];
     save();
     toast("Skill added to your profile");
     render();
    } else if (a === "co") {
     const n = t.dataset.c,
      i = F.co.indexOf(n);
     i > -1 ? F.co.splice(i, 1) : F.co.push(n);
     render();
    } else if (a === "clr") {
     F = defF();
     render();
    } else if (a === "rm") {
     const k0 = t.dataset.k,
      i = k0.indexOf(":"),
      k = i < 0 ? k0 : k0.slice(0, i),
      v = i < 0 ? "" : k0.slice(i + 1);
     if (k === "q") F.q = "";
     else if (k === "loc") F.loc = "";
     else if (["m", "ty", "lvl", "co", "ind", "sz"].includes(k)) F[k] = F[k].filter((x) => x !== v);
     else if (k === "sk")
      F.sk = skl(F.sk)
       .filter((x) => x !== v)
       .join(", ");
     else if (k === "e") F.e = 30;
     else if (k === "sal") F.sal = 0;
     else if (k === "mm") F.mm = 0;
     else if (k === "p") F.p = 0;
     else if (k === "hide") F.hide = false;
     render();
    } else if (a === "ssv") {
     u.ss = u.ss || [];
     u.ss.push({
      n:
       actv()
        .slice(0, 3)
        .map((x) => x[1])
        .join(" · ") || "All jobs",
      f: JSON.parse(JSON.stringify(F)),
     });
     save();
     toast("Search saved ");
     render();
    } else if (a === "ssa") {
     F = Object.assign(defF(), u.ss[+t.dataset.i].f);
     render();
    } else if (a === "ssd") {
     u.ss.splice(+t.dataset.i, 1);
     save();
     render();
    } else if (a === "as") {
     AS = t.dataset.s;
     render();
    } else if (a === "wd") {
     apps = apps.filter((x) => x.id !== id);
     save();
     toast("Application withdrawn");
     render();
    } else if (a === "theme") {
     const r = document.documentElement,
      dk = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
     r.dataset.theme = dk ? "light" : "dark";
    } else if (a === "pv2") {
     PF.lv = PF.lv === "board" ? "list" : "board";
     render();
    } else if (a === "sel") {
     const i = PF.sel.indexOf(id);
     i > -1 ? PF.sel.splice(i, 1) : PF.sel.push(id);
     render();
    } else if (a === "bulk" || a === "bulkm") {
     if (!PF.sel.length) {
      toast("Select applicants first");
      return;
     }
     const n = PF.sel.length;
     PF.sel.forEach((x) => {
      const p = apps.find((y) => y.id === x);
      if (!p) return;
      if (a === "bulk") p.st = t.dataset.s;
      (p.upd = p.upd || []).push({
       msg: a === "bulk" ? "Your application moved to: " + p.st : "Your application is under review. We will get back soon.",
       at: Date.now(),
      });
     });
     PF.sel = [];
     save();
     toast("Updated " + n + " candidates and notified them");
     render();
    } else if (a === "trs") render();
    else if (a === "tpl") {
     const p = TPL[+t.dataset.i];
     $("jt").value = p[1];
     $("jm").value = p[2];
     $("je").value = p[3];
     $("ja").value = p[4];
     $("jb").value = p[5];
     $("jk").value = p[6];
     pv();
     toast("Template applied");
    } else if (a === "dup") {
     const o = jobs.find((x) => x.id === id);
     jobs.unshift({ ...o, id: Date.now(), at: Date.now(), t: o.t + " (copy)" });
     save();
     toast("Job duplicated");
     render();
    } else if (a === "sk") {
     const k = t.dataset.s,
      l = skl(F.sk),
      i = l.indexOf(k);
     i > -1 ? l.splice(i, 1) : l.push(k);
     F.sk = l.join(", ");
     $("fsk").value = F.sk;
     t.classList.toggle("on");
     rl();
    } else if (a === "msg") {
     const x = apps.find((y) => y.id === id),
      m = t.dataset.m || $("um").value.trim();
     if (!m) {
      toast("Write an update first");
      return;
     }
     (x.upd = x.upd || []).push({ msg: m, at: Date.now() });
     save();
     toast("Update sent to " + x.name);
     render();
     rd();
    }
   });
   render();
   rai();
  </script>
 </body>
</html>
